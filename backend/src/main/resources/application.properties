spring.application.name=sb-ecom

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATASOURCE_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false

project.image=images/
image.base.url=${IMAGE_BASE_URL}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

spring.app.jwtSecret=${JWT_SECRET_KEY}
spring.app.jwtExpirationMs=${JWT_EXPIRATION:30000000}
spring.app.jwtCookieName=${JWT_COOKIE:springBootEcom}

frontend.url=${FRONT_END_URL:http://localhost:5173/}

stripe.secret.key=${STRIPE_SECRET_KEY}

